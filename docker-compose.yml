services:
  medcheck:
    build: .
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  redis:
    image: redis:8.0.2-alpine
    ports:
      - "${REDIS_PORT}:6379"

  db:
    image: postgres:16-alpine
    container_name: medcheck-db
    restart: always
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: medcheck_db
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d medcheck_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: